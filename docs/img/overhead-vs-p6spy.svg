<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">JDBC interceptor overhead — ns per operation (lower is better)</text>
