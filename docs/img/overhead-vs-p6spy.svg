  <text x="504" y="332" text-anchor="middle" font-size="11" fill="#3c4043">23.5 µs</text>
  <rect x="542" y="163" width="60" height="247" fill="#f29900" rx="3"/>
  <text x="572" y="155" text-anchor="middle" font-size="11" fill="#3c4043">82.3 µs</text>
