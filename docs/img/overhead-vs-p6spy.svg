  <rect x="150" y="395" width="60" height="15" fill="#9aa0a6" rx="3"/>
  <text x="180" y="387" text-anchor="middle" font-size="11" fill="#3c4043">4.9 µs</text>
  <rect x="218" y="343" width="60" height="67" fill="#1a73e8" rx="3"/>
