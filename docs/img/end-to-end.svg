  <rect x="198" y="187" width="60" height="223" fill="#9aa0a6" rx="3"/>
  <line x1="228" y1="186" x2="228" y2="188" stroke="#202124" stroke-width="1.5"/>
  <line x1="220" y1="186" x2="236" y2="186" stroke="#202124" stroke-width="1.5"/>
