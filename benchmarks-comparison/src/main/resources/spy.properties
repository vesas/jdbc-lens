# P6Spy configuration for the comparison harness.
#
# We're using P6DataSource (wraps an existing DataSource), so the
# `driverlist` directive is not required — leaving it unset keeps the
# wrapping logic from re-registering the H2 driver under a P6Spy
# delegating name.
#
# Logging goes to a rolling file rather than the console: console
# logging would be dominated by JVM stdout flushes, which would
# under-state P6Spy's real cost in code paths that don't print.
appender=com.p6spy.engine.spy.appender.FileLogger
logfile=build/p6spy.log
append=true
autoflush=false

# Keep P6Spy's default modules (logging, etc) — this is what someone
# evaluating P6Spy gets out of the box, which is the comparison we
# want to make.
modulelist=com.p6spy.engine.logging.P6LogFactory

# Stack-trace capture turned ON. Our profiler walks the stack on every
# emit so it can attribute each query to a call-site — that's the whole
# point of the library. Comparing it against P6Spy with stacktrace=false
# would compare two fundamentally different jobs (we attribute, P6Spy
# only logs), so the chart would understate P6Spy's real cost when
# someone configures it for the same use case.
stacktrace=true
